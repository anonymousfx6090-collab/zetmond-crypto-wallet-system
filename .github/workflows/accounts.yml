name: Accounts, authentication and verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zetmond
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zetmond_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zetmond -d zetmond_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgresql://zetmond:ci-only-password@127.0.0.1:5432/zetmond_auth_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:auth
      - run: pnpm build:auth
      - run: pnpm test:auth:browser
      - run: pnpm build
      - run: pnpm test
